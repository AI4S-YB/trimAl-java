name: numeric-env

# Measures how far the reference's own float bits depend on the environment the
# reference was built in. The port reproduces glibc 2.35 (ubuntu-22.04); this
# workflow runs the C++ oracle on ubuntu-22.04 and ubuntu-24.04 and compares what
# the oracle printed in the two, field by field. It changes nothing: the result
# is a measurement, written to the job log and uploaded as an artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIMAL_REFERENCE_COMMIT: d637091abe33595775f40480970d1a18d87a7bcb

jobs:
  oracle:
    name: Reference float oracle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: 11
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Environment
        run: |
          uname -a
          ldd --version | head -1
          g++ --version | head -1

      - name: Build the reference trimAl v1.5.1 from the pinned source
        run: |
          git clone --branch v1.5.1 --depth 1 https://github.com/inab/trimal upstream
          test "$(git -C upstream rev-parse HEAD)" = "$TRIMAL_REFERENCE_COMMIT"
          make -C upstream/source

      - name: Run the oracles (a mismatch against the port is a measurement here, not a failure)
        run: |
          python3 verify/numeric/run_numeric.py --label Linux || true
          python3 verify/numeric/run_math.py || true
          mv verify/numeric/runs/math verify/numeric/runs/math-Linux

      - name: Upload the oracle output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: numeric-oracle-${{ matrix.os }}
          retention-days: 28
          path: |
            verify/numeric/runs/Linux/**
            !verify/numeric/runs/Linux/*.java.txt
            verify/numeric/runs/math-Linux/**
            !verify/numeric/runs/math-Linux/*.java.txt

  compare:
    name: What the environment changes in the reference's float bits
    needs: oracle
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: numeric-oracle-ubuntu-22.04
          path: env-22.04
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: numeric-oracle-ubuntu-24.04
          path: env-24.04
      - name: Compare the oracle's own output between the two environments
        run: |
          echo "== module oracle (8,219 probes)"
          python3 verify/numeric/compare_env.py env-22.04/Linux env-24.04/Linux --write env-compare-numeric.json
          echo "== float oracle (492,300 probes)"
          python3 verify/numeric/compare_env.py env-22.04/math-Linux env-24.04/math-Linux --write env-compare-math.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: numeric-env-comparison
          retention-days: 28
          path: env-compare-*.json
