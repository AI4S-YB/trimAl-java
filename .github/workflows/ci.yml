name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch replaces the run still in progress for that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The reference is pinned by commit, not only by tag name.
  TRIMAL_REFERENCE_COMMIT: d637091abe33595775f40480970d1a18d87a7bcb

jobs:
  verify:
    # Pinned to 22.04 so the runner's glibc (2.35) and GCC (11) match the documented
    # reference environment. The reference's float bits are relative to both: on
    # ubuntu-latest (26.04: glibc 2.43, GCC 15) log10f is a different, correctly
    # rounded implementation and GCC 15 contracts one accumulation of the Q statistic
    # into a fused multiply-add. ubuntu-24.04 agrees with 22.04 bit for bit. Measured
    # by numeric-env.yml; see verify/reference-environments.json.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Repository checks (test resources tracked, executable bits, workflows)
        run: python3 verify/repo_check.py

      - name: Build the reference trimAl v1.5.1 from the pinned source
        run: |
          git clone --branch v1.5.1 --depth 1 https://github.com/inab/trimal upstream
          test "$(git -C upstream rev-parse HEAD)" = "$TRIMAL_REFERENCE_COMMIT"
          make -C upstream/source
          mkdir -p verify/bin
          cp upstream/source/trimal upstream/source/readal upstream/source/statal verify/bin/
          python3 verify/identify_reference.py

      - name: Build and unit-test the Java port (JUnit, incl. the golden CLI gate)
        working-directory: java
        shell: bash
        run: ./mvnw -B package

      - name: Generate deterministic corpora and manifests
        run: python3 verify/generate_suite.py

      - name: The generated manifests equal the committed ones
        run: |
          git diff --exit-code --stat -- \
            verify/quick_manifest.txt verify/extended_manifest.txt \
            verify/scale_manifest.txt verify/baseline_manifest.txt

      - name: Reference coverage (every reachable method and CLI option is ported)
        run: python3 verify/coverage_map.py

      - name: Numeric module oracle (bit-level, incl. parallel paths)
        run: python3 verify/numeric/run_numeric.py --label ci

      - name: Float math oracle (bit-level)
        run: python3 verify/numeric/run_math.py

      - name: Differential matrices (quick + extended + legacy)
        run: |
          python3 verify/differential.py verify/quick_manifest.txt --timeout 90 --jobs 2
          python3 verify/differential.py verify/extended_manifest.txt --timeout 90 --jobs 2
          python3 verify/differential.py verify/legacy_manifest.txt --timeout 90 --jobs 2

      - name: Companion CLI suite (readal/statal)
        run: python3 verify/companions/verify_companions.py --java-jar java/target/trimal.jar

      - name: Loader fuzz gates (three labels)
        run: python3 verify/fuzz_suite.py --all

      - name: CLI argument fuzz gates (three labels)
        run: python3 verify/argfuzz_suite.py --all

      - name: Boundary/alignment audit and direct-method probes
        run: |
          python3 verify/alignment_audit/run_audit.py --round ci
          python3 verify/alignment_audit/run_probes.py ci

      - name: Thread-count determinism gate
        run: python3 verify/threading_test.py

      - name: The runners left every tracked file untouched
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "tracked files were modified:"
            git status --porcelain
            git diff --stat
            exit 1
          fi

      - name: Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: verify-reports
          retention-days: 14
          path: |
            verify/results/**
            !verify/results/**/java/**
            verify/companions/runs/**
            verify/numeric/runs/**
            !verify/numeric/runs/math/**
            verify/alignment_audit/results_ci/**
            verify/alignment_audit/probes_ci/**
            verify/threading/**
            java/target/surefire-reports/**

  unit:
    # The same `mvn package` on every supported platform: the golden CLI gate runs the
    # port in-process against recorded reference output, so it needs no reference
    # binary and proves the build is byte-compatible wherever it can be built.
    name: Unit tests on ${{ matrix.os }} with JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Repository checks (test resources tracked, executable bits, workflows)
        run: python3 verify/repo_check.py
      - name: Build and run every unit test (incl. the golden CLI gate)
        working-directory: java
        shell: bash
        run: ./mvnw -B package
      - name: Surefire reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: surefire-${{ matrix.os }}-jdk${{ matrix.java }}
          retention-days: 7
          path: java/target/surefire-reports/
