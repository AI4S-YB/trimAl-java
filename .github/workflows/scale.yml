name: scale

# The slow conservation and HTML jobs of the scale gate: O(n^2 x L) statistics on a
# 3,583-sequence real alignment, and 60,000-column wide alignments. Too slow for the
# per-push workflow; run weekly and on demand. The gate is the same differential
# harness as everywhere else: rc, stdout, stderr and every produced file must be
# byte-identical, and a timeout is a failure.

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scale-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIMAL_REFERENCE_COMMIT: d637091abe33595775f40480970d1a18d87a7bcb

jobs:
  scale:
    # Same runner as ci.yml: the float bits of the reference are libm-relative.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: 11
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Build the reference trimAl v1.5.1 from the pinned source
        run: |
          git clone --branch v1.5.1 --depth 1 https://github.com/inab/trimal upstream
          test "$(git -C upstream rev-parse HEAD)" = "$TRIMAL_REFERENCE_COMMIT"
          make -C upstream/source
          mkdir -p verify/bin
          cp upstream/source/trimal upstream/source/readal upstream/source/statal verify/bin/
          python3 verify/identify_reference.py

      - name: Build and unit-test the Java port
        working-directory: java
        shell: bash
        run: ./mvnw -B package

      - name: Generate the scale manifest and its corpus
        run: python3 verify/generate_suite.py

      - name: Scale gate
        run: python3 verify/differential.py verify/scale_manifest.txt --timeout 3600 --jobs 1

      - name: Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scale-reports
          retention-days: 14
          path: |
            verify/results/scale_manifest-*/**/report.json
            verify/results/scale_manifest-*/*/result.json
