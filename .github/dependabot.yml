version: 2
# Weekly proposals for the two kinds of dependencies. All updates of one kind
# arrive in a single pull request, so a week does not turn into a burst of them.
# The workflow actions are pinned by commit, so an update is a deliberate review
# of the new hash, not a moved tag.
#
# Major versions are not proposed automatically:
# - a new major of an action can need a newer runner image or Node runtime than
#   the ubuntu-22.04 image this repository pins for its reference oracle;
# - the port is Java 11, and JUnit 6 is compiled for Java 17: a proposal that
#   bundled it failed to compile the tests.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    groups:
      maven:
        patterns: ["*"]
    ignore:
      - dependency-name: "org.junit*"
        update-types: ["version-update:semver-major"]
